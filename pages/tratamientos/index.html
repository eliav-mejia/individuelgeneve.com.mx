<body>

    <div id="root"><!--seo-root--><div class="page-loader" role="status" aria-label="Cargando"><span></span></div><!--/seo-root--></div>

    <script type="text/babel" src="../../js/layout.jsx"></script>
    <script type="text/babel" src="../../js/acceso.jsx"></script>
    <script type="text/babel">
        // Menu from public/db/tratamientos.json (groups + treatments). Booking by WhatsApp (WhatsAppBooking below) while accounts are
        // switched off (ACCOUNTS_ENABLED, js/layout.jsx): the in-page BookingWizard (js/reservas.jsx, unchanged) needs an account to confirm.
        // To bring it back: load reservas.jsx here and render <BookingWizard initialTreatment={picked} /> in #reservar.
        const DAYPARTS = ['Mañana (8:00 – 12:00)', 'Mediodía (12:00 – 16:00)', 'Tarde (16:00 – 20:00, lunes a viernes)'];

        const WhatsAppBooking = ({ treatments, picked }) => {
            const initial = picked || new URLSearchParams(window.location.search).get('tratamiento') || '';
            const [form, setForm] = useState({ treatment: initial, date: '', daypart: DAYPARTS[0], name: '', notes: '' });
            useEffect(() => { if (picked) setForm(f => ({ ...f, treatment: picked })); }, [picked]);
            const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
            const t = treatments.find(x => x.id === form.treatment);
            const today = new Date().toISOString().slice(0, 10);
            const message = [
                'Hola, quiero agendar una cita en Individuel Genève.',
                t ? `Tratamiento: ${t.name}` : 'Tratamiento: me gustaría recomendación',
                form.date ? `Fecha preferida: ${new Date(`${form.date}T12:00:00`).toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' })}` : null,
                `Horario: ${form.daypart}`,
                form.name.trim() ? `Nombre: ${form.name.trim()}` : null,
                form.notes.trim() ? `Notas: ${form.notes.trim()}` : null,
            ].filter(Boolean).join('\n');
            return (
                <form className="bg-white border border-ink-line rounded-3xl p-6 md:p-10 grid md:grid-cols-2 gap-5"
                      onSubmit={(e) => { e.preventDefault(); window.open(waLink(message), '_blank', 'noopener,noreferrer'); }}>
                    <label className="block md:col-span-2"><span className="label text-ink-400">Tratamiento</span>
                        <select className="field mt-2" value={form.treatment} onChange={set('treatment')}>
                            <option value="">No sé, quiero una recomendación</option>
                            {treatments.map(x => <option key={x.id} value={x.id}>{x.name}</option>)}
                        </select></label>
                    <label className="block"><span className="label text-ink-400">Fecha preferida</span>
                        <input className="field mt-2" type="date" min={today} value={form.date} onChange={set('date')} /></label>
                    <label className="block"><span className="label text-ink-400">Horario</span>
                        <select className="field mt-2" value={form.daypart} onChange={set('daypart')}>{DAYPARTS.map(d => <option key={d}>{d}</option>)}</select></label>
                    <label className="block md:col-span-2"><span className="label text-ink-400">Tu nombre (opcional)</span>
                        <input className="field mt-2" autoComplete="name" maxLength={80} value={form.name} onChange={set('name')} /></label>
                    <label className="block md:col-span-2"><span className="label text-ink-400">¿Algo que debamos saber? (opcional)</span>
                        <textarea className="field mt-2" rows="3" maxLength={400} placeholder="Tratamientos recientes, alergias, embarazo…" value={form.notes} onChange={set('notes')} /></label>
                    <div className="md:col-span-2 flex flex-wrap items-center justify-between gap-4 pt-2">
                        <p className="text-sm text-ink-400">Te confirmamos disponibilidad por WhatsApp. {t && t.price_mxn != null ? `${t.name}: ${formatMXN(t.price_mxn)}.` : ''}</p>
                        <button className="btn btn-dark">Agendar por WhatsApp</button>
                    </div>
                </form>
            );
        };

        const TreatmentsPage = () => {
            const { status, data } = useJson('tratamientos');
            const [picked, setPicked] = useState(null);
            const book = (id) => { setPicked(id); document.getElementById('reservar').scrollIntoView({ behavior: 'smooth' }); };

            return (
                <>
                    <section className="relative bg-ink text-white overflow-hidden">
                        <Img src="/img/servicios/01.webp" alt="" className="absolute inset-0 w-full h-full object-cover opacity-50" loading="eager" />
                        <div className="relative max-w-4xl mx-auto px-4 md:px-8 py-28 md:py-36 text-center animate-rise-in">
                            <p className="label text-blush-300 mb-6">Condesa · Ciudad de México</p>
                            <h1 className="text-5xl md:text-7xl">Menú de <span className="font-script text-blush-200">servicios</span></h1>
                            <p className="mt-8 text-lg text-white/85 max-w-2xl mx-auto">Combinamos tecnologías no invasivas en un tratamiento integral diseñado mediante un dermo-análisis y valorado por especialistas certificadas.</p>
                            <div className="flex flex-wrap justify-center gap-3 mt-10">
                                <a href="#reservar" className="btn btn-blush">Reservar cita</a>
                                <a href={waLink()} target="_blank" rel="noopener noreferrer" className="btn border border-white text-white hover:bg-white hover:text-ink">WhatsApp</a>
                            </div>
                        </div>
                    </section>

                    {status === 'loading' && <div className="max-w-6xl mx-auto px-4 py-16"><div className="h-64 rounded-3xl bg-blush-50 animate-pulse" /></div>}
                    {status === 'ready' && data.groups.map(g => {
                        const items = data.treatments.filter(t => t.group_id === g.id && t.active !== false).sort((a, b) => a.sort_order - b.sort_order);
                        return (
                            <section key={g.id} id={g.id} className="max-w-7xl mx-auto px-4 md:px-8 pt-20 scroll-mt-28">
                                <div className="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-10 reveal">
                                    <div>
                                        <h2 className="text-4xl md:text-5xl">{g.label}</h2>
                                        <p className="text-ink-500 mt-3 max-w-2xl">{g.intro}</p>
                                    </div>
                                    {g.link && <a href={g.link} className="label text-ink-400 hover:text-ink whitespace-nowrap">Conoce la tecnología →</a>}
                                </div>
                                <div className={`grid gap-6 ${items.length === 1 ? 'md:grid-cols-2' : 'sm:grid-cols-2 lg:grid-cols-3'}`}>
                                    {items.map(t => (
                                        <article key={t.id} className="reveal rounded-3xl overflow-hidden bg-blush-50 flex flex-col">
                                            <Img src={t.image} alt={t.name} className="w-full aspect-[4/3] object-cover" />
                                            <div className="p-8 flex-1 flex flex-col">
                                                <h3 className="text-3xl">{t.name}</h3>
                                                <p className="text-ink-500 mt-3 flex-1">{t.description}</p>
                                                <div className="flex items-center justify-between gap-3 mt-6">
                                                    <span className="text-sm text-ink-400">{formatPrice(t.price_mxn, 'Se cotiza en tu valoración')}</span>
                                                    <button className="btn btn-dark !py-3 sm:!py-2.5 !px-5 shrink-0" onClick={() => book(t.id)}>Reservar</button>
                                                </div>
                                            </div>
                                        </article>
                                    ))}
                                </div>
                            </section>
                        );
                    })}

                    <section id="reservar" className="max-w-5xl mx-auto px-4 md:px-8 py-24 scroll-mt-28">
                        <SectionTitle kicker="Por WhatsApp" script="cita">Agenda tu</SectionTitle>
                        {status === 'ready' && <WhatsAppBooking treatments={data.treatments.filter(x => x.active !== false).sort((a, b) => a.sort_order - b.sort_order)} picked={picked} />}
                        <p className="text-center text-sm text-ink-400 mt-10">
                            {BRAND.hours} · {BRAND.address}
                        </p>
                    </section>
                </>
            );
        };

        renderPage(TreatmentsPage);
    </script>
</body>
</html>
