<body>

    <div id="root"><!--seo-root--><div class="page-loader" role="status" aria-label="Cargando"><span></span></div><!--/seo-root--></div>

    <script type="text/babel" src="../../js/layout.jsx"></script>
    <script type="text/babel" src="../../js/acceso.jsx"></script>
    <script type="text/babel" src="../../js/tienda.jsx"></script>
    <script type="text/babel">
        // Coupons from public/db/cupones.json. «Usar cupón» saves the code (couponStore, js/tienda.jsx) and opens the matching
        // products; «Comprar ahora» then sends it to Stripe as prefilled_promo_code.
        const SHORT = { linea: 'Advance Pro', minimo: 'Desde $10,000', producto: 'En oferta' };

        const copyText = async (text) => {
            try { await navigator.clipboard.writeText(text); return true; } catch (e) { return false; }
        };

        // Where «Usar cupón» takes the visitor: the product, the category, or the whole shop.
        const targetFor = (c) => c.type === 'producto' && c.product_slugs.length === 1 ? `/pages/tienda/${c.product_slugs[0]}/`
            : c.category_ids.length ? `/pages/tienda/?cat=${c.category_ids[0]}` : '/pages/tienda/';

        const CouponCard = ({ c, catalog, selected }) => {
            const [copied, setCopied] = useState(false);
            const product = c.type === 'producto' ? catalog.bySlug[c.product_slugs[0]] : null;
            const copy = async () => { if (await copyText(c.code)) { setCopied(true); setTimeout(() => setCopied(false), 1600); } };
            const use = () => { couponStore.set(c.code); window.location.href = withBase(targetFor(c)); };
            return (
                <article className={`reveal flex rounded-3xl overflow-hidden border bg-white ${selected ? 'border-ink' : 'border-ink-line'}`}>
                    <div className="w-28 sm:w-36 shrink-0 bg-blush-100 border-r-2 border-dashed border-blush-300 flex flex-col items-center justify-center text-center p-4">
                        <p className="font-serif text-4xl sm:text-5xl leading-none">{c.discount}</p>
                        <p className="label text-ink-400 mt-3 !text-[0.58rem]">{SHORT[c.type]}</p>
                    </div>
                    <div className="flex-1 min-w-0 p-5 sm:p-6 flex flex-col">
                        <div className="flex gap-4">
                            <div className="flex-1 min-w-0">
                                <h3 className="text-2xl leading-tight">{c.title}</h3>
                                <p className="text-sm text-ink-500 mt-2">{c.description}</p>
                            </div>
                            {product && <a href={`/pages/tienda/${product.slug}/`} className="w-16 h-16 shrink-0 rounded-2xl bg-blush-50 overflow-hidden"><ProductImage product={product} className="w-full h-full p-1" /></a>}
                        </div>
                        <ul className="text-xs text-ink-400 mt-4 space-y-1">
                            {c.min_purchase_mxn && <li>Compra mínima {formatMXN(c.min_purchase_mxn)}</li>}
                            {c.valid_until && <li>Vigente hasta el {new Date(`${c.valid_until}T12:00:00`).toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' })}</li>}
                            {c.terms && <li>{c.terms}</li>}
                        </ul>
                        <div className="flex flex-wrap items-center gap-2 mt-auto pt-5">
                            <button onClick={copy} className="font-mono text-sm tracking-wider px-4 py-2.5 rounded-full border border-dashed border-ink/40 hover:border-ink" aria-label={`Copiar el código ${c.code}`}>
                                {c.code} <span className="label text-ink-400 ml-2 !text-[0.58rem]">{copied ? 'Copiado' : 'Copiar'}</span>
                            </button>
                            {selected
                                ? <span className="label text-blush-500 px-2 flex items-center gap-1"><IconCheck className="w-4 h-4" /> Cupón activo</span>
                                : <button onClick={use} className="btn btn-dark !py-2.5 !px-5">Usar cupón</button>}
                        </div>
                    </div>
                </article>
            );
        };

        const PromotionsPage = () => {
            const catalog = useCatalog();
            const selected = useCoupon();
            const [data, setData] = useState(null);
            const [group, setGroup] = useState(new URLSearchParams(window.location.search).get('tipo') || 'all');
            useEffect(() => { loadCoupons().then(setData).catch(() => setData({ groups: [], coupons: [] })); }, []);

            const chip = (active) => `shrink-0 px-5 py-2.5 rounded-full label transition-colors border ${active ? 'bg-ink text-white border-ink' : 'border-ink-line text-ink-500 hover:border-blush-400'}`;
            const groups = data ? data.groups.filter(g => data.coupons.some(c => c.type === g.id)) : [];

            return (
                <>
                    <PageHero eyebrow="Cupones Individuel Genève" title="Promociones" script="Advance Pro"
                        intro="Elige tu cupón y pulsa «Usar cupón»: el código se aplica al pagar con Stripe, o menciónalo al pedir por WhatsApp.">
                        <ClaimsRow className="mt-8" />
                    </PageHero>

                    <section className="max-w-6xl mx-auto px-4 md:px-8 pb-16">
                        {selected && (
                            <div className="mb-10 rounded-3xl bg-ink text-white px-6 py-5 flex flex-wrap items-center gap-4 animate-fade-in">
                                <p>Cupón activo <b className="font-medium tracking-wider text-blush-200">{selected.code}</b> · {selected.discount} · {selected.title}</p>
                                <a href={targetFor(selected)} className="btn btn-blush !py-2.5 !px-5 sm:ml-auto">Ver productos</a>
                                <button className="label text-white/70 hover:text-white" onClick={() => couponStore.set(null)}>Quitar</button>
                            </div>
                        )}

                        <div className="flex gap-2 overflow-x-auto no-scrollbar mb-12 border-b border-ink-line pb-6" role="group" aria-label="Tipo de cupón">
                            <button className={chip(group === 'all')} aria-pressed={group === 'all'} onClick={() => setGroup('all')}>Todos</button>
                            {groups.map(g => <button key={g.id} className={chip(group === g.id)} aria-pressed={group === g.id} onClick={() => setGroup(g.id)}>{g.label}</button>)}
                        </div>

                        {!data && <div className="grid md:grid-cols-2 gap-6">{[0, 1, 2, 3].map(i => <div key={i} className="h-56 rounded-3xl bg-blush-50 animate-pulse" />)}</div>}
                        {data && data.coupons.length === 0 && <p className="text-center text-ink-400 py-16">Por ahora no hay promociones vigentes. Vuelve pronto.</p>}

                        {groups.filter(g => group === 'all' || g.id === group).map(g => (
                            <div key={g.id} className="mb-16">
                                <div className="mb-8 reveal">
                                    <h2 className="text-4xl">{g.label}</h2>
                                    <p className="text-ink-500 mt-2">{g.intro}</p>
                                </div>
                                <div className="grid md:grid-cols-2 gap-6">
                                    {data.coupons.filter(c => c.type === g.id).map(c => <CouponCard key={c.code} c={c} catalog={catalog} selected={selected && selected.code === c.code} />)}
                                </div>
                            </div>
                        ))}
                    </section>

                    <section className="bg-blush-50 py-20">
                        <div className="max-w-5xl mx-auto px-4 md:px-8">
                            <SectionTitle kicker="Cómo usar tu cupón" script="pasos">Tres</SectionTitle>
                            <ol className="grid md:grid-cols-3 gap-6">
                                {[
                                    ['01', 'Elige', 'Pulsa «Usar cupón» o copia el código del cupón que prefieras.'],
                                    ['02', 'Compra', '«Comprar ahora» abre el pago seguro de Stripe con el código aplicado. Si pides por WhatsApp, el mensaje incluye el cupón.'],
                                    ['03', 'Condiciones', 'Un cupón por compra. Los cupones de $10,000 requieren ese monto en un solo pago. Sujeto a vigencia y existencias.'],
                                ].map(([n, t, x]) => (
                                    <li key={n} className="reveal bg-white rounded-3xl p-8">
                                        <p className="font-serif text-5xl text-blush-300">{n}</p>
                                        <h3 className="text-2xl mt-4">{t}</h3>
                                        <p className="text-sm text-ink-500 mt-2 leading-relaxed">{x}</p>
                                    </li>
                                ))}
                            </ol>
                        </div>
                    </section>

                    <WhatsAppCTA title="¿Dudas con un cupón?" text="Escríbenos y te ayudamos a armar tu pedido con la mejor promoción."
                        message="Hola, tengo una duda sobre las promociones de Individuel Genève." />
                </>
            );
        };

        renderPage(PromotionsPage);
    </script>
</body>
</html>
