<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu bolsa · Individuel Genève</title>
    <meta name="description" content="Revisa los productos de tu bolsa y finaliza tu pedido.">
    <link rel="canonical" href="https://individuelgeneve.com.mx/pages/bolsa/">
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#f4dfe2">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tailwind.config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="/js/layout.jsx"></script>
    <script type="text/babel" src="/js/acceso.jsx"></script>
    <script type="text/babel" src="/js/tienda.jsx"></script>
    <script type="text/babel">
        // STAGING checkout: the order is saved to the account (db.createOrder) and sent by WhatsApp for confirmation and payment.
        // Launch: db.createOrder → Edge Function → Stripe / Mercado Pago checkout (see README, "Hoja de ruta").
        const BagPage = () => {
            const catalog = useCatalog();
            const user = useUser();
            const { lines, subtotal, shipping, total, count } = useBagLines(catalog);
            const [sent, setSent] = useState(null);

            const checkout = async () => {
                if (!user) { openAuth('signup'); return; }
                const order = await db.createOrder({ user, lines, subtotal, shipping });
                const text = [
                    `Hola, quiero confirmar mi pedido ${order.id}:`,
                    ...lines.map(l => `• ${l.qty} × ${l.product.name} (${l.product.sku}) — ${formatMXN(l.qty * l.product.price_mxn)}`),
                    `Envío: ${shipping ? formatMXN(shipping) : 'gratis'}`,
                    `Total: ${formatMXN(total)}`,
                    `Cuenta: ${user.email}`,
                ].join('\n');
                window.open(`https://wa.me/${BRAND.whatsapp}?text=${encodeURIComponent(text)}`, '_blank', 'noopener,noreferrer');
                bag.clear();
                setSent(order);
            };

            if (sent) return (
                <PageHero eyebrow={`Pedido ${sent.id}`} title="Gracias," script="de verdad"
                    intro="Te escribimos por WhatsApp para confirmar el envío y el pago. Puedes seguir tu pedido en tu cuenta.">
                    <div className="flex justify-center gap-3 mt-10"><a href="/pages/cuenta/" className="btn btn-dark">Mi cuenta</a><a href="/pages/tienda/" className="btn btn-light">Seguir comprando</a></div>
                </PageHero>
            );

            return (
                <>
                    <PageHero eyebrow={`${count} ${count === 1 ? 'producto' : 'productos'}`} title="Tu" script="bolsa" />
                    <section className="max-w-6xl mx-auto px-4 md:px-8 pb-16">
                        {catalog.status === 'loading' && <div className="h-40 bg-blush-50 rounded-3xl animate-pulse" />}
                        {catalog.status === 'ready' && lines.length === 0 && (
                            <div className="text-center py-10">
                                <p className="text-ink-500">Tu bolsa está vacía.</p>
                                <a href="/pages/tienda/" className="btn btn-dark mt-8">Ir a la tienda</a>
                            </div>
                        )}
                        {lines.length > 0 && (
                            <div className="grid lg:grid-cols-3 gap-10">
                                <ul className="lg:col-span-2 divide-y divide-ink-line border-y border-ink-line">
                                    {lines.map(({ product: p, qty }) => (
                                        <li key={p.id} className="py-6 flex gap-5 items-center">
                                            <a href={`/pages/tienda/${p.slug}/`} className="w-24 h-28 shrink-0 rounded-2xl bg-blush-50"><Bottle product={p} className="w-full h-full p-2" /></a>
                                            <div className="flex-1 min-w-0">
                                                <p className="label text-ink-400">{p.hero_ingredient}</p>
                                                <a href={`/pages/tienda/${p.slug}/`} className="font-serif text-2xl block">{p.name}</a>
                                                <p className="text-sm text-ink-400">{p.size_ml} ml · {formatMXN(p.price_mxn)}</p>
                                                <div className="flex items-center gap-4 mt-3">
                                                    <div className="flex items-center border border-ink-line rounded-full text-sm">
                                                        <button className="w-9 h-9" onClick={() => bag.set(p.id, qty - 1)} aria-label="Menos">−</button>
                                                        <span className="w-5 text-center">{qty}</span>
                                                        <button className="w-9 h-9 disabled:opacity-30" onClick={() => bag.set(p.id, qty + 1)} disabled={qty >= p.stock} aria-label="Más">+</button>
                                                    </div>
                                                    <button className="label text-ink-400 hover:text-ink" onClick={() => bag.set(p.id, 0)}>Quitar</button>
                                                </div>
                                            </div>
                                            <p className="font-serif text-xl">{formatMXN(qty * p.price_mxn)}</p>
                                        </li>
                                    ))}
                                </ul>
                                <aside className="bg-blush-50 rounded-3xl p-8 self-start">
                                    <p className="label text-ink-400 mb-6">Resumen</p>
                                    <dl className="space-y-3 text-sm">
                                        <div className="flex justify-between"><dt>Subtotal</dt><dd>{formatMXN(subtotal)}</dd></div>
                                        <div className="flex justify-between"><dt>Envío</dt><dd>{shipping ? formatMXN(shipping) : 'Gratis'}</dd></div>
                                        {shipping > 0 && <p className="text-xs text-ink-400">Te faltan {formatMXN(FREE_SHIPPING_MXN - subtotal)} para el envío gratis.</p>}
                                        <div className="flex justify-between font-serif text-2xl pt-4 border-t border-blush-200"><dt>Total</dt><dd>{formatMXN(total)}</dd></div>
                                    </dl>
                                    <p className="text-xs text-ink-400 mt-2">IVA incluido.</p>
                                    <button className="btn btn-dark w-full mt-8" onClick={checkout}>{user ? 'Finalizar pedido' : 'Crear cuenta y finalizar'}</button>
                                    <p className="text-xs text-ink-400 mt-4 text-center">Confirmamos envío y pago por WhatsApp. <a href="/pages/terminos/#envios" className="underline underline-offset-4">Envíos y devoluciones</a></p>
                                </aside>
                            </div>
                        )}
                    </section>
                </>
            );
        };

        renderPage(BagPage);
    </script>
</body>
</html>
