            { id: 'reservaciones', title: 'Reservaciones', body: ['Todas las reservaciones estarán registradas bajo tus datos personales. Es recomendable crear una cuenta: te brindará mayor seguridad, podrás consultar tus citas, modificarlas y ceder los derechos a un tercero.'] },
