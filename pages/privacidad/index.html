<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:title" content="Políticas de privacidad · Individuel Genève">

    <meta property="og:type" content="website">
    <meta property="og:image" content="https://individuelgeneve.com.mx/img/inicio/01.webp">
    <link rel="icon" href="../../img/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#f4dfe2">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../js/tailwind.config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/site.css">

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="../../js/layout.jsx"></script>
    <script type="text/babel" src="../../js/acceso.jsx"></script>
    <script type="text/babel">
        // Text from individuelgeneve.com.mx/polticas-de-privacidad (2026-11-01). Pending review against the LFPDPPP (aviso de privacidad).
        const SECTIONS = [
            { id: 'intro', title: 'Introducción', body: ['En vigor a partir del 1 de septiembre de 2023.', 'En Individuel Genève México entendemos la importancia de la privacidad y la tomamos en serio. Esta política describe los tipos de información que recopilamos y cómo la usamos y protegemos. Al visitar nuestro sitio web o utilizar nuestros servicios, aceptas los términos de esta política.', `Responsable: ${BRAND.operator}, ${BRAND.address}.`] },
            { id: 'informacion', title: 'Información recopilada', body: ['Recopilamos información cuando utilizas nuestros servicios o visitas nuestro sitio web. Puede incluir:', [
                'Información personal: nombre, correo electrónico, dirección postal, número de teléfono y otra información de contacto.',
                'Información demográfica: edad, sexo y ubicación.',
                'Información de tratamiento: tratamientos que has recibido en nuestra clínica y tus preferencias y necesidades personales.',
                'Información de pago: datos relacionados con tu método de pago.',
                'Información técnica: dirección IP, tipo de navegador y sistema operativo.'],
                `No vendemos tu información personal. Tienes derecho a solicitar información sobre cómo compartimos tu información personal con terceros; escríbenos a ${BRAND.emailPrivacy}.`] },
            { id: 'uso', title: 'Cómo utilizamos tu información', body: [[
                'Para brindarte los servicios que solicitas y comunicarnos contigo acerca de ellos.', 'Para procesar pagos por los servicios que recibes.',
                'Para enviarte materiales promocionales sobre nuestros servicios y ofertas.', 'Para mejorar nuestro sitio web y servicios y comprender mejor las necesidades de nuestros clientes.',
                'Para cumplir con requisitos legales y proteger nuestros derechos y los de los demás.', 'Para usar como portafolio de evidencias.'],
                'No vendemos ni alquilamos tu información personal a terceros. Solo la compartimos con los proveedores que nos ayudan a brindarte los servicios que solicitas, para cumplir con requisitos legales (como una citación u orden judicial) o para proteger los derechos y la seguridad de Individuel Genève México y de nuestros clientes.'] },
            { id: 'seguridad', title: 'Seguridad de datos', body: ['Tomamos medidas razonables para proteger tu información personal del acceso, uso o divulgación no autorizados. Sin embargo, ninguna transmisión de datos por internet ni sistema de almacenamiento es 100 % seguro, por lo que no podemos garantizar su seguridad absoluta.'] },
            { id: 'cookies', title: 'Cookies', body: ['Utilizamos cookies para mejorar tu experiencia y recopilar información sobre cómo se utiliza nuestro sitio. Una cookie es un pequeño archivo de texto que se almacena en tu dispositivo. Puedes controlar su uso desde la configuración de tu navegador o desde el aviso de cookies de este sitio.'] },
            { id: 'cambios', title: 'Cambios a esta política', body: ['Podemos actualizar esta política para reflejar cambios en nuestras prácticas o en la ley. Te notificaremos cualquier cambio importante publicando la política revisada en este sitio y actualizando su fecha de entrada en vigor.'] },
            { id: 'contacto', title: 'Contáctanos', body: [`Si tienes alguna pregunta sobre esta política o sobre cómo manejamos tu información personal, escríbenos a ${BRAND.emailPrivacy}.`, 'Última actualización: 24 de agosto de 2023.'] },
        ];
        renderPage(() => <LegalPage eyebrow="Nuestras políticas" title="Políticas de" script="privacidad" intro="Política de privacidad de Individuel Genève México." sections={SECTIONS} />);
    </script>
</body>
</html>
